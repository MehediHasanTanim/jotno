<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans Bengali', 'Noto Sans', system-ui, sans-serif; }
    a { color: #2C6355; } a:hover { color: #1F4A3F; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#F7F9F8;display:flex;flex-direction:column;color:#14201C;box-sizing:border-box;">
  <div style="padding:56px 20px 14px;background:#FFFFFF;border-bottom:1px solid #E2E8E5;display:flex;flex-direction:column;gap:13px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <div style="flex-grow:1;font-size:22px;font-weight:600;">পরিমাপ</div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2C6355" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </div>
    <div style="display:flex;gap:7px;">
      <div style="background:#2C6355;color:#FFFFFF;padding:7px 15px;border-radius:16px;font-size:13px;font-weight:600;">বাবা</div>
      <div style="background:#FFFFFF;color:#5A6B65;padding:7px 15px;border-radius:16px;font-size:13px;border:1px solid #E2E8E5;">মা</div>
      <div style="background:#FFFFFF;color:#5A6B65;padding:7px 15px;border-radius:16px;font-size:13px;border:1px solid #E2E8E5;">আরিয়ান</div>
    </div>
  </div>
  <div style="flex-grow:1;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:12px;">
    <div style="background:#FFFFFF;border:1px solid #E2E8E5;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:11px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <div style="font-size:15px;font-weight:600;">রক্তচাপ</div>
        <div style="font-size:12px;color:#8A9691;">৩০ দিন</div>
      </div>
      <div style="display:flex;align-items:baseline;gap:9px;">
        <div style="font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;">১২৪/৮২</div>
        <div style="font-size:13px;color:#5A6B65;">mmHg · আজ</div>
      </div>
      <svg width="100%" height="46" viewBox="0 0 310 46" preserveAspectRatio="none"><polyline points="0,12 52,8 104,18 156,14 208,24 260,20 310,27" fill="none" stroke="#2C6355" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,33 52,31 104,37 156,33 208,40 260,37 310,41" fill="none" stroke="#A9BDB6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="background:#FFFFFF;border:1px solid #E2E8E5;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:11px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <div style="font-size:15px;font-weight:600;">রক্তে সুগার</div>
        <div style="font-size:12px;color:#8A9691;">৩০ দিন</div>
      </div>
      <div style="display:flex;align-items:baseline;gap:9px;">
        <div style="font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;">৫.৮</div>
        <div style="font-size:13px;color:#5A6B65;">mmol/L · খালি পেটে</div>
      </div>
      <svg width="100%" height="46" viewBox="0 0 310 46" preserveAspectRatio="none"><polyline points="0,18 52,24 104,14 156,22 208,16 260,20 310,15" fill="none" stroke="#2C6355" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="display:flex;gap:12px;">
      <div style="flex-grow:1;background:#FFFFFF;border:1px solid #E2E8E5;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:5px;">
        <div style="font-size:13px;color:#5A6B65;">ওজন</div>
        <div style="display:flex;align-items:baseline;gap:5px;"><div style="font-size:23px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;">৭২</div><div style="font-size:13px;color:#5A6B65;">kg</div></div>
        <div style="font-size:12px;color:#2C6355;">১.৫ kg কম · ৩ মাসে</div>
      </div>
      <div style="flex-grow:1;background:#FFFFFF;border:1px solid #E2E8E5;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:5px;">
        <div style="font-size:13px;color:#5A6B65;">BMI</div>
        <div style="display:flex;align-items:baseline;gap:5px;"><div style="font-size:23px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;">২৪.৯</div></div>
        <div style="font-size:12px;color:#8A9691;">১৭০ সেমি থেকে</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px;">
      <div style="font-size:13px;font-weight:600;color:#8A9691;letter-spacing:0.04em;">সাম্প্রতিক</div>
      <div style="background:#FFFFFF;border:1px solid #E2E8E5;border-radius:8px;overflow:hidden;">
        <div style="padding:12px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #EDF1EF;"><div style="flex-grow:1;font-size:14px;">রক্তচাপ ১২৪/৮২</div><div style="font-size:13px;color:#8A9691;">আজ ৭:৪০</div></div>
        <div style="padding:12px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #EDF1EF;"><div style="flex-grow:1;font-size:14px;">ওজন ৭২ kg</div><div style="font-size:13px;color:#8A9691;">২৬ আগ</div></div>
        <div style="padding:12px 14px;display:flex;align-items:center;gap:11px;"><div style="flex-grow:1;font-size:14px;">সুগার ৫.৮ mmol/L</div><div style="font-size:13px;color:#8A9691;">২৫ আগ</div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
