<div style="width: 390px; height: 844px; background: #F7F9F8; display: flex; flex-direction: column; color: #14201C; box-sizing: border-box;">

  <div style="padding: 56px 20px 14px; background: #FFFFFF; border-bottom: 1px solid #E2E8E5; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 22px; font-weight: 600; line-height: 1.4;">সেপ্টেম্বর ২০২৬</div>
    <div style="display: flex; gap: 4px;">

  </div>

  <div style="background: #FFFFFF; padding: 12px 16px 16px; border-bottom: 1px solid #E2E8E5; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;">
      <div style="text-align: center; font-size: 11px; color: #8A9691; font-weight: 600; padding: 4px 0;">শ</div>
      <div style="text-align: center; font-size: 11px; color: #8A9691; font-weight: 600; padding: 4px 0;">র</div>
      <div style="text-align: center; font-size: 11px; color: #8A9691; font-weight: 600; padding: 4px 0;">সো</div>
      <div style="text-align: center; font-size: 11px; color: #8A9691; font-weight: 600; padding: 4px 0;">ম</div>
      <div style="text-align: center; font-size: 11px; color: #8A9691; font-weight: 600; padding: 4px 0;">বু</div>
      <div style="text-align: center; font-size: 11px; color: #8A9691; font-weight: 600; padding: 4px 0;">বৃ</div>
      <div style="text-align: center; font-size: 11px; color: #8A9691; font-weight: 600; padding: 4px 0;">শু</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="30">
        <div style="height: 42px; border-radius: 6px; background: {{d.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
          <div style="font-size: 14px; font-weight: {{d.weight}}; color: {{d.fg}}; line-height: 1; font-variant-numeric: tabular-nums;">{{d.label}}</div>
          <div style="display: flex; gap: 2px; height: 4px; align-items: center;">
            <sc-for list="{{d.dots}}" as="c" hint-placeholder-count="2">
              <div style="width: 4px; height: 4px; border-radius: 2px; background: {{c}};"></div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;">

    <div style="display: flex; flex-direction: column; gap: 9px;">

      <div style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 8px; padding: 13px 14px; display: flex; gap: 12px; align-items: center;">
        <div style="font-size: 13px; color: #5A6B65; width: 52px; flex-shrink: 0; font-variant-numeric: tabular-nums;">৮:০০</div>
        <div style="width: 3px; height: 30px; border-radius: 2px; background: #2C6355; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <div style="font-size: 15px; font-weight: 500; line-height: 1.45;">মেটফরমিন · লোসারটান</div>
          <div style="font-size: 13px; color: #5A6B65;">বাবা</div>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 8px; padding: 13px 14px; display: flex; gap: 12px; align-items: center;">
        <div style="font-size: 13px; color: #5A6B65; width: 52px; flex-shrink: 0; font-variant-numeric: tabular-nums;">১৭:৩০</div>
        <div style="width: 3px; height: 30px; border-radius: 2px; background: #1F4A3F; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <div style="font-size: 15px; font-weight: 500; line-height: 1.45;">ডা. আহমেদ</div>
          <div style="font-size: 13px; color: #5A6B65;">বাবা · পপুলার ডায়াগনস্টিক</div>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 8px; padding: 13px 14px; display: flex; gap: 12px; align-items: center;">
        <div style="font-size: 13px; color: #5A6B65; width: 52px; flex-shrink: 0; font-variant-numeric: tabular-nums;">২০:০০</div>
        <div style="width: 3px; height: 30px; border-radius: 2px; background: #2C6355; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <div style="font-size: 15px; font-weight: 500; line-height: 1.45;">মেটফরমিন</div>
          <div style="font-size: 13px; color: #5A6B65;">বাবা</div>
        </div>
      </div>

    </div>

    <div style="display: flex; gap: 14px; padding-top: 4px; flex-wrap: wrap;">
      <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 7px; height: 7px; border-radius: 4px; background: #2C6355;"></div><div style="font-size: 12px; color: #8A9691;">ওষুধ</div></div>
      <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 7px; height: 7px; border-radius: 4px; background: #1F4A3F;"></div><div style="font-size: 12px; color: #8A9691;">অ্যাপয়েন্টমেন্ট</div></div>
      <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 7px; height: 7px; border-radius: 4px; background: #A8600B;"></div><div style="font-size: 12px; color: #8A9691;">টিকা</div></div>
    </div>

  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E2E8E5; padding: 10px 8px 24px; display: flex; justify-content: space-around; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 68px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A9691" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg>
      <div style="font-size: 11px; color: #8A9691;">হোম</div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 68px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A9691" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      <div style="font-size: 11px; color: #8A9691;">টাইমলাইন</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 68px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A9691" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a5 5 0 0 0-7-7l-10 10a5 5 0 0 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
      <div style="font-size: 11px; color: #8A9691;">ওষুধ</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 68px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C6355" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 11h18"/></svg>
      <div style="font-size: 11px; color: #2C6355; font-weight: 600;">ক্যালেন্ডার</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 68px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A9691" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      <div style="font-size: 11px; color: #8A9691;">আরও</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bn = (n) => String(n).replace(/[0-9]/g, (c) => '০১২৩৪৫৬৭৮৯'[Number(c)]);
    const MED = '#2C6355', APPT = '#1F4A3F', VAC = '#A8600B';
    const events = {
      1: [MED], 2: [MED], 3: [MED, APPT], 4: [MED], 5: [MED],
      7: [MED], 8: [MED], 9: [MED], 10: [MED, VAC], 11: [MED],
      14: [MED], 15: [MED], 16: [MED], 17: [MED], 18: [MED],
      21: [MED], 22: [MED], 23: [MED], 24: [MED], 25: [MED],
      28: [MED], 29: [MED], 30: [MED],
    };
    const days = [];
    for (let i = 0; i < 2; i += 1) days.push({ label: '', bg: 'transparent', fg: '#8A9691', weight: '400', dots: [] });
    for (let d = 1; d <= 30; d += 1) {
      const sel = d === 3;
      days.push({
        label: bn(d),
        bg: sel ? '#2C6355' : 'transparent',
        fg: sel ? '#FFFFFF' : '#14201C',
        weight: sel ? '700' : '400',
        dots: sel ? [] : (events[d] || []),
      });
    }
    return { days };
  }
}
</script>
</body>
</html>
