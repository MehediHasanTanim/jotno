# Jotno CI.
#
# Lives at the repository root because GitHub only discovers workflows under
# `<repo-root>/.github/workflows/`. The Flutter project sits in `jotno/`, so
# every step runs from there via the `working-directory` default below.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: jotno

jobs:
  verify:
    name: analyze, test, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to commit SHAs, not moving tags, so a
      # compromised tag cannot silently change what runs in CI.
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Flutter
        # subosito/flutter-action@v2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # ---------------------------------------------------------------------
      # The encryption gates. These two steps are the reason this workflow
      # exists: a build that quietly loses the cipher looks perfectly healthy
      # until someone pulls the database file off a device.
      # ---------------------------------------------------------------------
      - name: The encryption switch is present
        # Parsed as YAML rather than grepped, so a comment, a re-indent or a
        # reordering cannot make the gate pass by accident.
        run: |
          python3 - <<'PY'
          import sys
          import yaml

          with open('pubspec.yaml') as handle:
              spec = yaml.safe_load(handle)

          source = (
              (spec.get('hooks') or {})
              .get('user_defines', {})
              .get('sqlite3', {})
              .get('source')
          )
          if source != 'sqlite3mc':
              print(
                  '::error::pubspec.yaml must set '
                  'hooks.user_defines.sqlite3.source to "sqlite3mc"; found '
                  f'{source!r}. Without it the app ships upstream SQLite and '
                  'writes the database in plaintext.'
              )
              sys.exit(1)
          print('encryption switch: source = sqlite3mc')
          PY

      - name: Forbidden packages are absent
        # Discontinued or banned by the architecture (AD-2). `pubspec.lock` is
        # in scope deliberately: these must be absent from the *resolved*
        # dependency tree, not merely unimported. That is why the database
        # opens through `package:drift` directly instead of the Flutter
        # convenience wrapper, which drags both into the lock file.
        #
        # grep exits 0 on a match, 1 on no match, and >=2 on an error such as a
        # missing path. Only 1 is success — treating >=2 as "clean" would let
        # the gate pass while scanning nothing.
        run: |
          required="pubspec.yaml pubspec.lock lib"
          for path in $required; do
            if [ ! -e "$path" ]; then
              echo "::error::expected $path to exist; the scan would be blind"
              exit 1
            fi
          done

          # Platform directories are included when present, so the gate covers
          # them automatically if desktop or web targets are added later.
          scan="$required build.yaml analysis_options.yaml"
          for path in test integration_test android ios macos linux windows web; do
            [ -e "$path" ] && scan="$scan $path"
          done
          echo "scanning: $scan"

          pattern='sqlcipher_flutter_libs|sqlite3_flutter_libs|riverpod_generator|drift_flutter'
          grep -R -n -E "$pattern" $scan && status=0 || status=$?
          case "$status" in
            0)
              echo "::error::a forbidden package is referenced above"
              exit 1
              ;;
            1)
              echo "no forbidden packages found"
              ;;
            *)
              echo "::error::grep failed with exit status $status"
              exit 1
              ;;
          esac

      - name: Install dependencies
        # --enforce-lockfile fails rather than silently resolving to versions
        # nobody reviewed.
        run: flutter pub get --enforce-lockfile

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generated sources are up to date
        # `git add -AN` gives newly generated, still-untracked files an
        # intent-to-add entry so `git diff` can see them. Without it the gate is
        # blind to any file the generator creates for the first time.
        run: |
          dart run build_runner build
          git add -AN .
          if ! git diff --exit-code; then
            echo "::error::generated sources are stale; run build_runner and commit the result"
            exit 1
          fi

      # The logging gate. Sits beside Analyze because it is the same kind of
      # check — static, cheap, and about what the source is allowed to contain
      # — but it catches what the analyzer cannot. `avoid_print` covers `print`
      # and says nothing about `debugPrint`, `debugPrintStack`,
      # `stdout.writeln`, `stderr.writeln` or `dart:developer`'s `log`, and
      # every one of those writes medical records to `adb logcat` where nothing
      # can redact them afterwards. The gate closes all of them and allows
      # `dart:developer` in exactly one file: the writer that needs it.
      #
      # The scan lives in `tool/no_print_gate.sh` so a developer can run
      # exactly what CI runs, and so `test/tool/no_print_gate_test.dart` can
      # prove it fails on real offending files rather than assuming it would.
      # That script handles grep's exit codes the same way the two gates above
      # do: only exit 1 is clean, >=2 is a broken scan, not a passing one. It
      # prints plain `file:line:` matches rather than `::error file=`
      # annotations, because this job runs with `working-directory: jotno`
      # while GitHub resolves annotation paths from the repository root.
      - name: Nothing under lib writes to the device log
        run: bash tool/no_print_gate.sh

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Runs everything under `test/`, including the generated migration tests
      # once schema v2 exists.
      - name: Test
        run: flutter test

      # Hand-written migrations are not permitted. Regenerating must be a no-op;
      # if it is not, someone changed the schema without running the tool.
      #
      # At schema v1 there is nothing to migrate *from*, so `make-migrations`
      # emits only `drift_schemas/app_database/drift_schema_v1.json`. From v2
      # onwards it also emits `*.steps.dart` and tests under `test/migration/`,
      # which the step above then runs — hence `git add -AN` here too, since
      # those files are brand new at the version bump.
      - name: Migration schemas are up to date
        run: |
          dart run drift_dev make-migrations
          git add -AN .
          if ! git diff --exit-code -- drift_schemas test/migration; then
            echo "::error::migration schemas are stale; run drift_dev make-migrations and commit the result"
            exit 1
          fi
