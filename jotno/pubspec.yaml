name: jotno
description: "Jotno — a family health record that never leaves the device."
# Private package: never publish to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2
  # Pinned so a local build cannot diverge from the version CI installs.
  flutter: '>=3.47.2 <4.0.0'

# ---------------------------------------------------------------------------
# THE ENCRYPTION SWITCH.
#
# This block is the entire encryption configuration. It tells `package:sqlite3`
# to build and bundle SQLite3MultipleCiphers instead of upstream SQLite.
# `package:sqlite3` ships its own build hook; there is no hook/build.dart here.
#
# Removing or changing `source: sqlite3mc` ships an UNENCRYPTED database.
# `lib/core/database/connection.dart` throws at startup if that happens, in
# release as well as debug — see `requireEncryptedSqlite`.
#
# Note: `hooks: user_defines:` applies to the whole pub workspace, not to a
# single package. Relevant if this repo ever becomes a workspace.
# ---------------------------------------------------------------------------
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  # Ships with the SDK. Supplies the Material, Cupertino and Widgets
  # localisation delegates for `bn`, which the generated `AppLocalizations`
  # delegate sits alongside in `main.dart`.
  flutter_localizations:
    sdk: flutter

  drift: ^2.34.2
  # Version deliberately unconstrained: `flutter_localizations` pins `intl`
  # exactly, and any caret range here would sooner or later contradict it and
  # make the whole solve fail. `pubspec.lock` is the pin, and CI resolves with
  # `--enforce-lockfile`.
  intl: any
  path_provider: ^2.1.6
  sqlite3: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.15.2
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Runs `gen-l10n` on `pub get` and before every build, using `l10n.yaml`.
  # The generated sources are committed, so `flutter analyze` and the editor
  # see the same `AppLocalizations` CI does.
  generate: true
