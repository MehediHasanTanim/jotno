targets:
  $default:
    builders:
      drift_dev:
        options:
          # Dates are stored as UTC ISO-8601 text, not unix timestamps.
          store_date_time_values_as_text: true

          # Required by `dart run drift_dev make-migrations`. Hand-written
          # migrations are not permitted; everything under `drift_schemas/`
          # and `test/migration/` is generated by that command.
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/migration/
